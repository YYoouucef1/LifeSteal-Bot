name: Minecraft Bot 24/7
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *' # سيعيد التأكد من تشغيل البوت كل 15 دقيقة

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      - run: npm install mineflayer
      - run: node index.js
        timeout-minutes: 350 # سيستمر بالعمل لأقصى مدة ممكنة قبل أن يعيد GitHub تشغيله
